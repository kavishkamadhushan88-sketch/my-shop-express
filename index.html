<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>MAYADHUNNA EXPRESS - Customer</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg: #121212;
  --card: #1e1e1e;
  --muted: #aaa;
  --accent: #0ea5a4;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Inter, system-ui, Arial;
  background: var(--bg);
  color: #f5f5f5;
}

header {
  position: sticky;
  top: 0;
  background: #1a1a1a;
  padding: 18px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 100;
  border-bottom: 1px solid #333;
}

.rgb-banner {
  font-size: 1.5rem;
  font-weight: bold;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
  color: white;
  background: linear-gradient(90deg, red, green, blue, indigo, violet);
  background-size: 400% 400%;
  animation: rainbow 10s linear infinite;
  margin: 10px;
}
@keyframes rainbow {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
  padding: 16px;
}

.card {
  background: var(--card);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.imgwrap {
  width: 100%;
  padding-top: 100%;
  position: relative;
  overflow: hidden;
  border-radius: 8px;
  background: #222;
}
.imgwrap img {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}

.btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 10px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

/* Modal and Cart Styles */
.modalback {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 200;
}
.modal {
  background: #1a1a1a;
  padding: 20px;
  border-radius: 12px;
  width: 90%;
  max-width: 500px;
  border: 1px solid var(--accent);
}

table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
</style>
</head>
<body>

<header>
  <h1>MAYADHUNNA EXPRESS</h1>
  <button id="openCartBtn" class="btn" style="padding: 5px 15px;">Cart (<span id="cartCount">0</span>)</button>
</header>

<main>
  <div class="rgb-banner">✨ Your Choice | Your Order ✨<br>Mayadunnana Express 🎉</div>

  <div style="padding: 16px; display: flex; gap: 10px;">
    <input id="searchInput" type="search" placeholder="Search products..." style="flex:1; padding: 10px; border-radius: 8px; background: #222; color: white; border: 1px solid #444;">
  </div>

  <div id="productGrid" class="grid">පූරණය වෙමින්...</div>
</main>

<div id="cartModal" class="modalback">
  <div class="modal">
    <h2>Shopping Cart</h2>
    <div id="cartContents"></div>
    <div style="margin-top: 20px; display: flex; gap: 10px;">
      <button class="btn" id="checkoutBtn">Checkout</button>
      <button onclick="closeCart()" style="background:none; border:none; color:white; cursor:pointer;">Close</button>
    </div>
  </div>
</div>

<div id="checkoutModal" class="modalback">
  <div class="modal">
    <h2>Order Details</h2>
    <input type="text" id="custName" placeholder="ඔබේ නම" style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="text" id="custAddress" placeholder="ලිපිනය" style="width:100%; padding:10px; margin-bottom:10px;">
    <input type="text" id="custPhone" placeholder="දුරකථන අංකය" style="width:100%; padding:10px; margin-bottom:10px;">
    <button class="btn" style="width:100%;" onclick="sendOrder()">WhatsApp හරහා ඇණවුම් කරන්න</button>
    <button onclick="closeCheckout()" style="background:none; border:none; color:white; width:100%; margin-top:10px; cursor:pointer;">Cancel</button>
  </div>
</div>

<script>
// --- FIREBASE CONFIG (ඔබ ලබාදුන් දත්ත) ---
const firebaseConfig = {
  apiKey: "AIzaSyDM1DbXuL1wXxai1SyUt_K89JQpF0n4pFk",
  authDomain: "myshopexpress-c5c9e.firebaseapp.com",
  projectId: "myshopexpress-c5c9e",
  storageBucket: "myshopexpress-c5c9e.firebasestorage.app",
  messagingSenderId: "686789244314",
  appId: "1:686789244314:web:241da7281573cbffd47623"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let products = [];
let cart = JSON.parse(localStorage.getItem('mh_cart_v1') || '[]');
updateCartCount();

// Firebase එකෙන් භාණ්ඩ ලබා ගැනීම (Real-time)
db.collection("products").onSnapshot(snap => {
    products = [];
    snap.forEach(doc => products.push({ id: doc.id, ...doc.data() }));
    renderProducts(products);
});

function renderProducts(list) {
    const grid = document.getElementById('productGrid');
    if (list.length === 0) { grid.innerHTML = "භාණ්ඩ නොමැත."; return; }
    
    grid.innerHTML = list.map(p => `
        <div class="card">
            <div class="imgwrap"><img src="${p.images ? p.images[0] : ''}"></div>
            <div style="font-weight:bold;">${p.name}</div>
            <div style="color:var(--accent);">රු ${p.price.toLocaleString()}</div>
            <button class="btn" onclick="addToCart('${p.id}')">Add to Cart</button>
        </div>
    `).join('');
}

// Search Function
document.getElementById('searchInput').oninput = (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = products.filter(p => p.name.toLowerCase().includes(q));
    renderProducts(filtered);
};

// Cart Functions
function addToCart(id) {
    const item = cart.find(i => i.id === id);
    if(item) item.qty++; else cart.push({id, qty: 1});
    saveCart();
    alert("Cart එකට එකතු කළා!");
}

function saveCart() {
    localStorage.setItem('mh_cart_v1', JSON.stringify(cart));
    updateCartCount();
}

function updateCartCount() {
    const count = cart.reduce((s, i) => s + i.qty, 0);
    document.getElementById('cartCount').textContent = count;
}

// Open/Close Cart
document.getElementById('openCartBtn').onclick = () => {
    const modal = document.getElementById('cartModal');
    const contents = document.getElementById('cartContents');
    
    if(cart.length === 0) { alert("Cart එක හිස්!"); return; }
    
    let html = `<table><tr><th>Item</th><th>Qty</th><th>Price</th></tr>`;
    let total = 0;
    cart.forEach(c => {
        const p = products.find(x => x.id === c.id);
        if(p) {
            html += `<tr><td>${p.name}</td><td>${c.qty}</td><td>රු ${(p.price * c.qty).toLocaleString()}</td></tr>`;
            total += (p.price * c.qty);
        }
    });
    html += `<tr><td colspan="2"><b>Total</b></td><td><b>රු ${total.toLocaleString()}</b></td></tr></table>`;
    contents.innerHTML = html;
    modal.style.display = 'flex';
};

function closeCart() { document.getElementById('cartModal').style.display = 'none'; }

// Checkout and WhatsApp Order
document.getElementById('checkoutBtn').onclick = () => {
    closeCart();
    document.getElementById('checkoutModal').style.display = 'flex';
};

function closeCheckout() { document.getElementById('checkoutModal').style.display = 'none'; }

function sendOrder() {
    const name = document.getElementById('custName').value;
    const address = document.getElementById('custAddress').value;
    const phone = document.getElementById('custPhone').value;

    if(!name || !address || !phone) { alert("කරුණාකර විස්තර ඇතුළත් කරන්න!"); return; }

    let cartText = "";
    let grandTotal = 0;
    cart.forEach(it => {
        const p = products.find(x => x.id === it.id);
        if(p) {
            cartText += `• ${p.name} (${it.qty} x රු ${p.price.toLocaleString()})%0A`;
            grandTotal += (p.price * it.qty);
        }
    });

    const msg = `🛒 *MAYADHUNNA EXPRESS - NEW ORDER*%0A%0A👤 *නම:* ${name}%0A🏠 *ලිපිනය:* ${address}%0A📞 *දුරකථන:* ${phone}%0A%0A📦 *අයිතම:*%0A${cartText}%0A💰 *මුළු මුදල:* රු ${grandTotal.toLocaleString()}`;
    const sellerNumber = "94755104531"; 
    
    window.open(`https://wa.me/${sellerNumber}?text=${msg}`, "_blank");
    
    cart = [];
    saveCart();
    closeCheckout();
    alert("Order එක සාර්ථකව යොමු කළා!");
}
</script>
</body>
</html>
